{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" >
        <meta name ="viewport" content = "width=device-width, initial-scale=1.0">
        <title>Agregar Producto</title>
        <link rel="stylesheet"
        href="{% static 'administracion/css/productos.css' %}">
    </head>

    <body>
        <header class="header">
            <div class="logo">
                <span> Oliviva</span>
            </div>
            <h1>Agregar Producto</h1>
            <a href="#" class="btn-volver">↩</a>
        </header>

        <main class="contenedor">
            <form method="POST" class="formulario-producto">
                {% csrf_token %}




                {% if form.errors %}
                  <div style="color: red;">
                {{ form.errors }}
                  </div>
                {% endif %}




                <div class="campo imagen-campo">
                    <label>Imagen del producto</label>
                    <div class="zona-imagen">
                        <span class="icono-subir"></span>
                        <input type="file"
                               name="imagen"
                               accept="image/*">
                    </div>
                </div>

                <div class="campo nombre-campo">
                    <label for="nombre">
                        Nombre
                    </label>
                    <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Jean Gase"
                    required>
                </div>
                    <div class="campo descripcion-campo">
                    <label for="descripcion">
                        Descripcion
                    </label>
                    <input 
                          type="text"
                          id="descripcion"
                          name="descripcion"
                          placeholder="Ej: Jean Gase">
                </div>
                <div class="fila-datos">
                    <div class="campo">
                        <label>
                            Precio
                        </label>

                        <input 
                              type="text"
                              id="precio"
                              name="precioOriginal"
                              placeholder="$0"
                              inputmode="decimal">
                    </div>

                    <div class="campo">
                        <label for="stock">
                            Stock
                        </label>
                        <input 
                              type="number"
                              id="stock"
                              name="stock"
                              placeholder="0">
                    </div>
                    <div class="campo">
                    <label for="color">
                        Color
                    </label>
                    <input  
                          type="text"
                          id="color"
                          name="color">
                    </div>       
                 </div>
                 <div class="campo">
                <div class="campo">
                    <label for="talle">
                        Talle
                    </label>
                    <input 
                        type="text"
                        id="talle"
                        name="talle"
                        placeholder="Ej: 38"
                        required>
                </div>
                </div>
                <div class="campo categoria-campo">
                    <label for="categoria">
                        Categoría
                    </label>
                    <select id="categoria" name="categoria">
                         <option value="">Seleccionar Categoría</option>
                         {% for categoria in form.fields.categoria.queryset %}
                           <option value="{{ categoria.idCategoria }}"
                             {% if form.data.categoria == categoria.idCategoria|stringformat:"s" %}selected{% endif %}>
                             {{ categoria.nombreCategoria }}
                           </option>
                          {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn-guardar">
                Guardar Producto
                </button>
            </form>
        </main>
    </body>
</html>
