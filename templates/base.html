{% load static %}
<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{% block title %}Olivia{% endblock %}</title>


    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
         
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>


<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid px-4">

                <!-- Logo -->
                <a class="navbar-brand" href="{% url 'inicio' %}">

                    <img src="{% static 'img/Logo.png' %}" class="logo-navbar">

                </a>

                

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

                

                <div class="collapse navbar-collapse justify-content-center"
                     id="menu">


                    <ul class="navbar-nav">
                        <li class="nav-item">
                           <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                        </li>

                        <li class="nav-item">
                          <a class="nav-link" href="{% url 'productos' %}">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contacto</a>
                        </li>
                    </ul>
                </div>

                

                <a href="#" class="fs-4 text-dark">

                    <i class="bi bi-bag bolsa-carrito"></i>

                </a>

            </div>
        </nav>
    </header>

    

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- Bootstrap JS -->

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>


</body>

</html>
